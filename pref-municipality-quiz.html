<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>都道府県内市区町村位置クイズ - 日本地図</title>
<style>
  :root {
    --bg: #0f172a;
    --panel-bg: #131c31;
    --panel-bg-2: #1b2740;
    --ink: #eef2fb;
    --sub-ink: #93a2c2;
    --accent: #34d399;
    --accent-2: #a78bfa;
    --bad: #f87171;
    --warn: #fbbf24;
    --map-fill: #26314d;
    --map-hover: #34456b;
    --map-stroke: #0f172a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100%;
  }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  header { padding: 14px 20px 10px; text-align: center; flex-shrink: 0; }
  header h1 { margin: 0 0 4px; font-size: 1.4rem; letter-spacing: .02em; }
  header h1 .icon { margin-right: 6px; }
  header p { margin: 0; color: var(--sub-ink); font-size: .85rem; }
  nav.crosslink { margin-top: 8px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  nav.crosslink a {
    color: var(--accent-2); text-decoration: none; font-size: .78rem;
    border: 1px solid #2e2447; padding: 4px 10px; border-radius: 999px;
  }
  nav.crosslink a:hover { background: rgba(167,139,250,.12); }

  main.layout {
    flex: 1; display: flex; gap: 16px; padding: 8px 16px 16px;
    max-width: 1280px; width: 100%; margin: 0 auto; align-items: stretch;
  }
  .map-pane {
    flex: 1 1 0; min-width: 0; background: var(--panel-bg); border-radius: 16px;
    padding: 10px; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 24px rgba(0,0,0,.25); position: relative;
  }
  .map-wrap { width: 100%; max-width: 720px; position: relative; overflow: hidden; touch-action: none; border-radius: 8px; }
  svg.japan-real-map { width: 100%; height: auto; display: block; transform-origin: 0 0; }

  .zoom-controls { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  .zoom-controls button {
    flex: none; width: 38px; height: 38px; padding: 0; font-size: 1.15rem; line-height: 1;
    background: rgba(27,39,64,.88);
  }

  .prefecture { fill: var(--map-fill); stroke: var(--map-stroke); stroke-width: 1.2px; cursor: pointer; transition: fill .15s; }
  body.mode-select .prefecture:hover { fill: var(--map-hover); }
  body.mode-play .prefecture { cursor: default; fill: #2f3d63; }
  .locked-map .prefecture { cursor: default; }

  .pin-group { pointer-events: none; }
  .pin-drop { stroke: #fff; stroke-width: 1.4; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }
  .pin-drop.actual { fill: #ef4444; }
  .pin-drop.guess { fill: #38bdf8; }
  .pin-dot { fill: #fff; }
  .pin-pulse { fill: none; stroke-width: 1.5; opacity: .7; transform-origin: center; animation: pinPulse 1.1s ease-out infinite; }
  .pin-pulse.actual { stroke: #ef4444; }
  .pin-pulse.guess { stroke: #38bdf8; }
  @keyframes pinPulse {
    0% { r: 3; opacity: .8; }
    100% { r: 13; opacity: 0; }
  }
  .pin-enter { animation: pinDrop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes pinDrop {
    0% { transform: translateY(-14px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  .guess-line { stroke: #fbbf24; stroke-width: 1.2; stroke-dasharray: 3 2.4; opacity: .85; }

  aside.panel { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel-bg); border-radius: 16px; padding: 16px; box-shadow: 0 4px 24px rgba(0,0,0,.25); }

  .select-card p { margin: 0 0 12px; font-size: .85rem; color: var(--sub-ink); line-height: 1.55; }
  .select-card label { display: block; font-size: .78rem; color: var(--sub-ink); margin: 14px 0 6px; letter-spacing: .04em; }
  select {
    width: 100%; font: inherit; font-size: .95rem; padding: 10px 10px; border-radius: 10px;
    border: 1px solid #2a3a5c; background: var(--panel-bg-2); color: var(--ink);
  }

  .sign-card { text-align: center; }
  .sign-card .label { font-size: .78rem; color: var(--sub-ink); margin-bottom: 8px; letter-spacing: .05em; }
  .sign-board {
    background: linear-gradient(160deg, #1f1733, #2a1f45);
    border: 3px solid #4c3a75;
    border-radius: 10px;
    padding: 22px 10px;
    position: relative;
  }
  .sign-board::before {
    content: "\1F4CD";
    position: absolute;
    top: 8px;
    left: 12px;
    font-size: 1rem;
    opacity: .6;
  }
  .city-name {
    font-size: 2.1rem;
    font-weight: 700;
    letter-spacing: .03em;
    color: #ddd6fe;
    text-shadow: 0 0 18px rgba(167,139,250,.3);
    word-break: keep-all;
  }
  .sign-card .hint-pref { margin-top: 8px; font-size: .8rem; color: var(--sub-ink); }
  .sign-card .pref-tag {
    display: inline-block; margin-top: 6px; font-size: .72rem; color: var(--accent-2);
    border: 1px solid #4c3a75; border-radius: 999px; padding: 2px 10px;
  }

  .feedback {
    min-height: 46px; font-size: .88rem; line-height: 1.4; border-radius: 10px;
    padding: 10px 12px; transition: background .2s, color .2s;
  }
  .feedback.ok { background: rgba(52,211,153,.15); color: var(--accent); }
  .feedback.mid { background: rgba(251,191,36,.15); color: var(--warn); }
  .feedback.bad { background: rgba(248,113,113,.15); color: var(--bad); }
  .feedback.skip { background: rgba(56,189,248,.15); color: #38bdf8; }
  .feedback.idle { color: var(--sub-ink); }

  .stats { display: flex; justify-content: space-between; gap: 8px; }
  .stat { flex: 1; text-align: center; }
  .stat .n { font-size: 1.3rem; font-weight: 700; }
  .stat .l { font-size: .72rem; color: var(--sub-ink); }

  .progress-bar { height: 6px; border-radius: 4px; background: #263250; overflow: hidden; margin-top: 10px; }
  .progress-bar > div { height: 100%; background: var(--accent-2); width: 0%; transition: width .25s; }

  .controls { display: flex; gap: 10px; }
  button {
    flex: 1; font: inherit; font-size: .85rem; padding: 10px 8px; border-radius: 10px;
    border: 1px solid #2a3a5c; background: var(--panel-bg-2); color: var(--ink);
    cursor: pointer; transition: background .15s, transform .1s;
  }
  button:hover { background: #253253; }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent-2); color: #201033; border-color: var(--accent-2); font-weight: 700; }
  button.primary:hover { background: #bda6fb; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  .summary { text-align: center; }
  .summary .big { font-size: 2.2rem; font-weight: 700; color: var(--accent-2); margin: 6px 0; }
  .summary .msg { color: var(--sub-ink); font-size: .85rem; margin-bottom: 12px; }
  .summary .controls { flex-direction: column; }

  footer { text-align: center; padding: 10px; font-size: .7rem; color: var(--sub-ink); }
  footer a { color: var(--sub-ink); }

  @media (max-width: 860px) {
    main.layout { flex-direction: column; }
    aside.panel { width: 100%; flex-direction: row; flex-wrap: wrap; }
    .card { flex: 1 1 100%; }
    .sign-card { flex: 1 1 100%; }
  }

  .start-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(15,23,42,.9);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .start-overlay.hidden { display: none; }
  .start-card {
    background: var(--panel-bg); border-radius: 20px; padding: 30px 26px;
    max-width: 420px; width: 100%; text-align: center;
    box-shadow: 0 12px 48px rgba(0,0,0,.5);
  }
  .start-card h2 { margin: 0 0 8px; font-size: 1.25rem; }
  .start-card p { margin: 0 0 22px; color: var(--sub-ink); font-size: .85rem; line-height: 1.5; }
  .count-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .count-grid button { padding: 16px 8px; font-size: 1rem; }
  .progress-note { margin: 14px 0 0; font-size: .72rem; color: var(--sub-ink); line-height: 1.5; }
  .back-link {
    display: inline-block; margin-top: 16px; font-size: .78rem; color: var(--sub-ink);
    text-decoration: underline; cursor: pointer; background: none; border: none;
  }
</style>
</head>

      if (!tracking) {
        tracking = true;
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp);
      }
    });

    // suppress the answer click if this gesture was actually a drag/pinch
    container.addEventListener('click', function (e) {
      if (moved > 10) e.stopPropagation();
    }, true);

    var zoomInBtn = document.getElementById('zoomInBtn');
    var zoomOutBtn = document.getElementById('zoomOutBtn');
    var zoomResetBtn = document.getElementById('zoomResetBtn');
    if (zoomInBtn) zoomInBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      animated(true);
      var r = container.getBoundingClientRect();
      zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.5);
    });
    if (zoomOutBtn) zoomOutBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      animated(true);
      var r = container.getBoundingClientRect();
      zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.5);
    });
    if (zoomResetBtn) zoomResetBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      animated(true);
      scale = 1; tx = 0; ty = 0; apply();
    });

    container._resetZoom = function () {
      animated(true);
      scale = 1; tx = 0; ty = 0; apply();
    };
  }
  setupPanZoom(mapWrap, svgEl);

  var SVGNS = 'http://www.w3.org/2000/svg';
  function addPin(x, y, kind) {
    var g = document.createElementNS(SVGNS, 'g');
    g.setAttribute('class', 'pin-group pin-enter');
    g.setAttribute('transform', 'translate(' + x + ',' + y + ')');

    var pulse = document.createElementNS(SVGNS, 'circle');
    pulse.setAttribute('class', 'pin-pulse ' + kind);
    pulse.setAttribute('cx', 0); pulse.setAttribute('cy', 0); pulse.setAttribute('r', 3);

    var drop = document.createElementNS(SVGNS, 'path');
    drop.setAttribute('class', 'pin-drop ' + kind);
    drop.setAttribute('d', 'M0 0 C -7.5 -9.5 -7.5 -18 0 -18 C 7.5 -18 7.5 -9.5 0 0 Z');

    var dot = document.createElementNS(SVGNS, 'circle');
    dot.setAttribute('class', 'pin-dot');
    dot.setAttribute('cx', 0); dot.setAttribute('cy', -11.5); dot.setAttribute('r', 2.8);

    g.appendChild(pulse); g.appendChild(drop); g.appendChild(dot);
    pinLayer.appendChild(g);
  }

  function addLine(x1, y1, x2, y2) {
    var line = document.createElementNS(SVGNS, 'line');
    line.setAttribute('class', 'guess-line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    pinLayer.insertBefore(line, pinLayer.firstChild);
  }

  function clearPins() {
    pinLayer.innerHTML = '';
  }

  function setLocked(v) {
    locked = v;
    mapWrap.classList.toggle('locked-map', v);
  }

  function svgPoint(evt) {
    var pt = svgEl.createSVGPoint();
    pt.x = evt.clientX; pt.y = evt.clientY;
    var ctm = svgEl.getScreenCTM();
    if (!ctm) return null;
    var loc = pt.matrixTransform(ctm.inverse());
    return { x: loc.x, y: loc.y };
  }

  // ---- stage: prefecture selection ----
  function showPrefSelectStage() {
    stage = 'pref-select';
    body.className = 'mode-select';
    svgEl.setAttribute('viewBox', ORIGINAL_VIEWBOX);
    svgEl.querySelectorAll('.prefecture').forEach(function (p) { p.style.display = ''; });
    if (mapWrap._resetZoom) mapWrap._resetZoom();
    clearPins();
    panelSelect.style.display = '';
    panelPlaySign.style.display = 'none';
    panelPlayFeedback.style.display = 'none';
    panelPlayStats.style.display = 'none';
    panelPlayControls.style.display = 'none';
    summaryCard.style.display = 'none';
    countOverlay.classList.add('hidden');
    prefSelect.selectedIndex = -1;
  }

  function choosePrefecture(code) {
    if (!PREF_MUNI[code]) return;
    selectedCode = code;
    var total = PREF_MUNI[code].length;
    countTitle.textContent = PREF_NAME_BY_CODE[code] + 'を出題';
    countSubtitle.textContent = '出題数を選んでください（全' + total + '市区町村）';
    countAllBtn.textContent = '全' + total + '市区町村';
    updateProgressNoteP(code);
    countOverlay.classList.remove('hidden');
  }

  svgEl.addEventListener('click', function (e) {
    if (stage === 'pref-select') {
      var target = e.target.closest ? e.target.closest('.prefecture') : null;
      if (!target) return;
      var code = target.getAttribute('data-code');
      if (code) choosePrefecture(code);
      return;
    }
    if (stage === 'playing') {
      handleGuess(e);
    }
  });

  prefSelect.addEventListener('change', function () {
    if (prefSelect.value) choosePrefecture(prefSelect.value);
  });

  randomPrefBtn.addEventListener('click', function () {
    var code = PREF_CODES[Math.floor(Math.random() * PREF_CODES.length)];
    choosePrefecture(code);
  });

  backToPrefBtn.addEventListener('click', function () {
    countOverlay.classList.add('hidden');
    selectedCode = null;
  });

  resetProgressBtnP.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!selectedCode) return;
    PREF_MUNI[selectedCode].forEach(function (m) { delete CORRECT[correctKeyFor(m)]; });
    saveCorrect();
    updateProgressNoteP(selectedCode);
  });

  var countButtons = countOverlay.querySelectorAll('button[data-count]');
  for (var ci = 0; ci < countButtons.length; ci++) {
    countButtons[ci].addEventListener('click', function () {
      var raw = this.getAttribute('data-count');
      var count = raw === 'all' ? 'all' : parseInt(raw, 10);
      countOverlay.classList.add('hidden');
      startGame(selectedCode, count);
    });
  }

  // ---- stage: playing ----
  function zoomToPrefecture(code) {
    svgEl.querySelectorAll('.prefecture').forEach(function (p) {
      p.style.display = (p.getAttribute('data-code') === code) ? '' : 'none';
    });
    var target = svgEl.querySelector('.prefecture[data-code="' + code + '"]');
    var bbox = target.getBBox();
    var pad = Math.max(bbox.width, bbox.height) * 0.15 + 6;
    var vb = [bbox.x - pad, bbox.y - pad, bbox.width + pad * 2, bbox.height + pad * 2];
    svgEl.setAttribute('viewBox', vb.join(' '));
    bboxDiag = Math.sqrt(vb[2] * vb[2] + vb[3] * vb[3]);
  }

  function startGame(code, count) {
    stage = 'playing';
    body.className = 'mode-play';
    zoomToPrefecture(code);
    if (mapWrap._resetZoom) mapWrap._resetZoom();
    clearPins();

    var pool = PREF_MUNI[code];
    var remaining = pool.filter(function (m) { return !CORRECT[correctKeyFor(m)]; });
    if (remaining.length === 0) {
      pool.forEach(function (m) { delete CORRECT[correctKeyFor(m)]; });
      saveCorrect();
      remaining = pool;
    }
    var shuffled = shuffle(remaining);
    queue = (count === 'all' || !count) ? shuffled : shuffled.slice(0, Math.min(count, shuffled.length));
    idx = 0;
    totalScore = 0;
    answered = 0;
    setLocked(false);

    panelSelect.style.display = 'none';
    panelPlaySign.style.display = '';
    panelPlayFeedback.style.display = '';
    panelPlayStats.style.display = '';
    panelPlayControls.style.display = '';
    summaryCard.style.display = 'none';
    skipBtn.disabled = false;
    endBtn.disabled = false;

    updateStats();
    nextQuestion();
  }

  function updateStats() {
    scoreNEl.textContent = totalScore;
    answeredNEl.textContent = answered;
    avgNEl.textContent = answered ? Math.round(totalScore / answered) : '-';
    progressFillEl.style.width = (idx / queue.length * 100) + '%';
  }

  function nextQuestion() {
    if (idx >= queue.length) {
      showSummary();
      return;
    }
    var m = queue[idx];
    idx++;
    current = { code: m[0], prefName: m[1], cityName: m[2], gun: m[3] || '', x: m[4], y: m[5] };
    cityNameEl.textContent = current.cityName;
    hintPrefEl.textContent = current.gun ? ('(' + current.gun + ')') : ' ';
    prefTagEl.textContent = current.prefName;
    feedbackEl.textContent = '地図をクリックして解答してね';
    feedbackEl.className = 'feedback idle';
    updateStats();
    setLocked(false);
  }

  function scoreTier(score) {
    if (score >= 90) return { cls: 'ok', label: '🎯 パーフェクト！' };
    if (score >= 70) return { cls: 'ok', label: '😄 とても近い！' };
    if (score >= 40) return { cls: 'mid', label: '🙂 まずまず' };
    if (score >= 15) return { cls: 'mid', label: '😅 惜しい…' };
    return { cls: 'bad', label: '😵 大きく外れました' };
  }

  function handleGuess(evt) {
    if (locked || !current || stage !== 'playing') return;
    var pt = svgPoint(evt);
    if (!pt) return;
    setLocked(true);
    answered++;

    var dx = pt.x - current.x;
    var dy = pt.y - current.y;
    var dist = Math.sqrt(dx * dx + dy * dy);
    var distPct = dist / bboxDiag;
    var scoreVal = Math.round(Math.max(0, 100 * Math.exp(-4 * distPct)));
    totalScore += scoreVal;

    if (scoreVal >= CORRECT_THRESHOLD) {
      CORRECT[current.code + ':' + current.cityName] = true;
      saveCorrect();
    }

    var tier = scoreTier(scoreVal);
    feedbackEl.textContent = tier.label + ' ' + current.cityName + ' はここでした。（' + scoreVal + '点）';
    feedbackEl.className = 'feedback ' + tier.cls;

    addLine(pt.x, pt.y, current.x, current.y);
    addPin(pt.x, pt.y, 'guess');
    addPin(current.x, current.y, 'actual');
    updateStats();

    setTimeout(function () {
      clearPins();
      nextQuestion();
    }, 1900);
  }

  function handleSkip() {
    if (locked || !current || stage !== 'playing') return;
    setLocked(true);
    addPin(current.x, current.y, 'actual');
    feedbackEl.textContent = '⏭️ スキップ： ' + current.cityName + ' はここでした。';
    feedbackEl.className = 'feedback skip';
    updateStats();
    setTimeout(function () {
      clearPins();
      nextQuestion();
    }, 1500);
  }

  function showSummary() {
    stage = 'summary';
    updateStats();
    summaryCard.style.display = 'block';
    panelPlaySign.style.display = 'none';
    panelPlayFeedback.style.display = 'none';
    panelPlayStats.style.display = 'none';
    panelPlayControls.style.display = 'none';
    var avg = answered ? Math.round(totalScore / answered) : 0;
    summaryScoreEl.textContent = totalScore + '点';
    var msg;
    if (answered === 0) msg = 'まだ解答していません。';
    else if (avg >= 85) msg = '完璧！' + PREF_NAME_BY_CODE[selectedCode] + 'マスターです！';
    else if (avg >= 60) msg = 'お見事！かなり詳しいですね。';
    else if (avg >= 35) msg = 'まずまず！もう一周してみよう。';
    else msg = 'まだまだ伸びしろあり！復習してみよう。';
    summaryMsgEl.textContent = msg + '（平均 ' + avg + '点 / ' + answered + '問中）';
    setLocked(true);
  }

  skipBtn.addEventListener('click', handleSkip);
  endBtn.addEventListener('click', function () {
    if (!current) return;
    setLocked(true);
    showSummary();
  });
  changePrefBtn.addEventListener('click', showPrefSelectStage);
  chooseAnotherBtn.addEventListener('click', showPrefSelectStage);
  playAgainBtn.addEventListener('click', function () {
    choosePrefecture(selectedCode);
  });

  showPrefSelectStage();
})();
</script>

</body>
</html>
