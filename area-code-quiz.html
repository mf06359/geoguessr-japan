<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>市外局番クイズ - 日本地図</title>
<style>
  :root {
    --bg: #0f172a;
    --panel-bg: #131c31;
    --panel-bg-2: #1b2740;
    --ink: #eef2fb;
    --sub-ink: #93a2c2;
    --accent: #34d399;
    --accent-2: #38bdf8;
    --bad: #f87171;
    --warn: #fbbf24;
    --map-fill: #26314d;
    --map-hover: #34456b;
    --map-stroke: #0f172a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100%;
  }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 14px 20px 10px;
    text-align: center;
    flex-shrink: 0;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.4rem;
    letter-spacing: .02em;
  }
  header h1 .icon { margin-right: 6px; }
  header p {
    margin: 0;
    color: var(--sub-ink);
    font-size: .85rem;
  }
  main.layout {
    flex: 1;
    display: flex;
    gap: 16px;
    padding: 8px 16px 16px;
    max-width: 1280px;
    width: 100%;
    margin: 0 auto;
    align-items: stretch;
  }
  .map-pane {
    flex: 1 1 0;
    min-width: 0;
    background: var(--panel-bg);
    border-radius: 16px;
    padding: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 24px rgba(0,0,0,.25);
    position: relative;
  }
  .map-wrap { width: 100%; max-width: 720px; position: relative; overflow: hidden; touch-action: none; border-radius: 8px; }
  svg.geolonia-svg-map { width: 100%; height: auto; display: block; transform-origin: 0 0; }

  .zoom-controls { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
  .zoom-controls button {
    flex: none; width: 38px; height: 38px; padding: 0; font-size: 1.15rem; line-height: 1;
    background: rgba(27,39,64,.88);
  }

  .prefecture { fill: var(--map-fill); stroke: var(--map-stroke); stroke-width: 1.4px; cursor: pointer; }
  .prefecture:hover:not(.locked-map) { fill: var(--map-hover); }
  .prefecture.correct { fill: var(--accent) !important; }
  .prefecture.wrong { fill: var(--bad) !important; }
  .prefecture.reveal { fill: var(--warn) !important; }
  .prefecture.skipped-reveal { fill: var(--accent-2) !important; }
  .locked-map .prefecture { cursor: default; }

  aside.panel {
    width: 320px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: var(--panel-bg);
    border-radius: 16px;
    padding: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,.25);
  }

  .phone-card { text-align: center; }
  .phone-card .label { font-size: .78rem; color: var(--sub-ink); margin-bottom: 8px; letter-spacing: .05em; }
  .phone-screen {
    background: linear-gradient(160deg, #0d1526, #172140);
    border: 1px solid #2a3a5c;
    border-radius: 14px;
    padding: 22px 10px;
    position: relative;
  }
  .phone-screen::before {
    content: "☎";
    position: absolute;
    top: 10px;
    left: 14px;
    font-size: 1rem;
    opacity: .5;
  }
  .area-code {
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: .04em;
    color: var(--accent-2);
    text-shadow: 0 0 18px rgba(56,189,248,.35);
  }
  .area-code .dim { color: #4c5b7c; font-size: 1.6rem; }
  .phone-card .hint-city {
    margin-top: 8px;
    font-size: .85rem;
    color: var(--sub-ink);
    display: none;
  }

  .feedback {
    min-height: 46px;
    font-size: .88rem;
    line-height: 1.4;
    border-radius: 10px;
    padding: 10px 12px;
    transition: background .2s, color .2s;
  }
  .feedback.ok { background: rgba(52,211,153,.15); color: var(--accent); }
  .feedback.bad { background: rgba(248,113,113,.15); color: var(--bad); }
  .feedback.skip { background: rgba(56,189,248,.15); color: var(--accent-2); }
  .feedback.idle { color: var(--sub-ink); }

  .stats { display: flex; justify-content: space-between; gap: 8px; }
  .stat { flex: 1; text-align: center; }
  .stat .n { font-size: 1.3rem; font-weight: 700; }
  .stat .l { font-size: .72rem; color: var(--sub-ink); }

  .progress-bar {
    height: 6px;
    border-radius: 4px;
    background: #263250;
    overflow: hidden;
    margin-top: 10px;
  }
  .progress-bar > div {
    height: 100%;
    background: var(--accent-2);
    width: 0%;
    transition: width .25s;
  }

  .controls { display: flex; gap: 10px; }
  button {
    flex: 1;
    font: inherit;
    font-size: .85rem;
    padding: 10px 8px;
    border-radius: 10px;
    border: 1px solid #2a3a5c;
    background: var(--panel-bg-2);
    color: var(--ink);
    cursor: pointer;
    transition: background .15s, transform .1s;
  }
  button:hover { background: #253253; }
  button:active { transform: scale(.97); }
  button.primary { background: var(--accent-2); color: #0b1220; border-color: var(--accent-2); font-weight: 700; }
  button.primary:hover { background: #5cc9fb; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  .summary { text-align: center; }
  .summary .big { font-size: 2.4rem; font-weight: 700; color: var(--accent-2); margin: 6px 0; }
  .summary .msg { color: var(--sub-ink); font-size: .85rem; margin-bottom: 12px; }

  footer {
    text-align: center;
    padding: 10px;
    font-size: .7rem;
    color: var(--sub-ink);
  }
  footer a { color: var(--sub-ink); }

  @media (max-width: 860px) {
    main.layout { flex-direction: column; }
    aside.panel { width: 100%; flex-direction: row; flex-wrap: wrap; }
    .card { flex: 1 1 100%; }
    .phone-card { flex: 1 1 100%; }
  }

  .start-overlay {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(15,23,42,.88);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .start-overlay.hidden { display: none; }
  .start-card {
    background: var(--panel-bg); border-radius: 20px; padding: 30px 26px;
    max-width: 420px; width: 100%; text-align: center;
    box-shadow: 0 12px 48px rgba(0,0,0,.5);
  }
  .start-card h2 { margin: 0 0 8px; font-size: 1.25rem; }
  .start-card p { margin: 0 0 22px; color: var(--sub-ink); font-size: .85rem; line-height: 1.5; }
  .count-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .count-grid button { padding: 16px 8px; font-size: 1rem; }
  .progress-note { margin: 14px 0 0; font-size: .72rem; color: var(--sub-ink); line-height: 1.5; }
  .back-link {
    display: inline-block; margin-top: 10px; font-size: .78rem; color: var(--sub-ink);
    text-decoration: underline; cursor: pointer; background: none; border: none; padding: 0;
  }
</style>
</head>

    <div class="count-grid">
      <button data-count="1">1問</button>
      <button data-count="5">5問</button>
      <button data-count="10">10問</button>
      <button data-count="all" class="primary">全47問</button>

    <p class="progress-note" id="progressNote">&nbsp;</p>

</div>

  var mapWrap = document.getElementById('mapWrap');
  var svgMap = mapWrap.querySelector('svg');
  var areaCodeEl = document.getElementById('areaCode');
  var hintCityEl = document.getElementById('hintCity');
  var feedbackEl = document.getElementById('feedback');
  var scoreNEl = document.getElementById('scoreN');
  var answeredNEl = document.getElementById('answeredN');
  var progressNEl = document.getElementById('progressN');
  var progressFillEl = document.getElementById('progressFill');
  var skipBtn = document.getElementById('skipBtn');
  var restartBtn = document.getElementById('restartBtn');
  var summaryCard = document.getElementById('summaryCard');
  var summaryScoreEl = document.getElementById('summaryScore');
  var summaryMsgEl = document.getElementById('summaryMsg');
  var playAgainBtn = document.getElementById('playAgainBtn');
  var startOverlay = document.getElementById('startOverlay');
  var progressNoteEl = document.getElementById('progressNote');
  var resetProgressBtn = document.getElementById('resetProgressBtn');

  var keys = Object.keys(PREF_DATA);
  var queue = [];
  var idx = 0;
  var score = 0;
  var answered = 0;
  var locked = false;
  var currentKey = null;

  // ---- correct-answer tracking: once you get one right it's excluded from
  // the pool until you've cycled through everything else, or you reset.
  var PROGRESS_KEY = 'areacode-quiz-correct-v1';
  var CORRECT = loadProgress();

  function loadProgress() {
    try {
      var raw = window.localStorage.getItem(PROGRESS_KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) {
      return {};
    }
  }
  function saveProgress() {
    try {
      window.localStorage.setItem(PROGRESS_KEY, JSON.stringify(CORRECT));
    } catch (e) { /* private mode / storage disabled: just skip persistence */ }
  }
  function updateProgressNote() {
    var doneCount = keys.filter(function (k) { return CORRECT[k]; }).length;
    progressNoteEl.textContent = doneCount > 0
      ? ('✅ 正解済み ' + doneCount + '/' + keys.length + '件は、出し切るかリセットするまで出題されません')
      : ' ';
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // ---- pan & zoom (mouse wheel, pinch, drag, buttons) ----
  function setupPanZoom(container, target) {
    var scale = 1, tx = 0, ty = 0;
    var MIN_SCALE = 1, MAX_SCALE = 6;
    var pointers = {};
    var dragStart = null;
    var pinchStartDist = null;
    var moved = 0;
    var TRANSITION = 'transform 220ms cubic-bezier(.22,1,.36,1)';

    // Animate discrete triggers (wheel tick, buttons, reset) so the zoom
    // glides instead of jumping; drag/pinch turn this off so the map
    // tracks the pointer 1:1 with no lag.
    function animated(on) {
      target.style.transition = on ? TRANSITION : 'none';
    }

    function apply() {
      target.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
    }

    function clampPan(rect) {
      var scaledW = rect.width * scale, scaledH = rect.height * scale;
      var minTx = Math.min(0, rect.width - scaledW);
      var minTy = Math.min(0, rect.height - scaledH);
      if (tx > 0) tx = 0;
      if (ty > 0) ty = 0;
      if (tx < minTx) tx = minTx;
      if (ty < minTy) ty = minTy;
    }

    function zoomAt(clientX, clientY, factor) {
      var rect = container.getBoundingClientRect();
      var cx = clientX - rect.left;
      var cy = clientY - rect.top;
      var newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale * factor));
      var applied = newScale / scale;
      tx = cx - (cx - tx) * applied;
      ty = cy - (cy - ty) * applied;
      scale = newScale;
      if (scale <= MIN_SCALE) { scale = MIN_SCALE; tx = 0; ty = 0; }
      clampPan(rect);
      apply();
    }

    container.addEventListener('wheel', function (e) {
      e.preventDefault();
      // Scale the zoom step to the wheel/trackpad delta magnitude instead
      // of a fixed jump per event, so trackpad scrolling feels continuous.
      var dy = Math.max(-100, Math.min(100, e.deltaY));
      animated(true);
      zoomAt(e.clientX, e.clientY, Math.pow(1.0018, -dy));
    }, { passive: false });

    // Deliberately NOT using setPointerCapture: capturing a pointer on the
    // container retargets the resulting synthetic "click" event's e.target
    // to the container itself, which breaks closest('.prefecture') lookups
    // in the answer-click handler. Track the gesture via window listeners
    // instead so click targeting stays untouched.
    var tracking = false;

    function onPointerMove(e) {
      if (!pointers[e.pointerId]) return;
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pointers);
      if (ids.length === 1 && dragStart) {
        var dx = e.clientX - dragStart.x;
        var dy = e.clientY - dragStart.y;
        moved = Math.max(moved, Math.hypot(dx, dy));
        if (scale > MIN_SCALE) {
          tx = dragStart.tx + dx;
          ty = dragStart.ty + dy;
          clampPan(container.getBoundingClientRect());
          apply();
        }
      } else if (ids.length === 2) {
        var pts = ids.map(function (id) { return pointers[id]; });
        var dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
        var mid = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
        if (pinchStartDist) zoomAt(mid.x, mid.y, dist / pinchStartDist);
        pinchStartDist = dist;
        moved = 999;
      }
    }

    function onPointerUp(e) {
      delete pointers[e.pointerId];
      var ids = Object.keys(pointers);
      if (ids.length < 2) pinchStartDist = null;
      if (ids.length === 0) {
        dragStart = null;
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
        window.removeEventListener('pointercancel', onPointerUp);
        tracking = false;
      }
    }

    container.addEventListener('pointerdown', function (e) {
      if (e.target.closest && e.target.closest('button')) return;
      if (e.button !== undefined && e.button > 0) return;
      animated(false);
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pointers);
      moved = 0;
      if (ids.length === 1) {
        dragStart = { x: e.clientX, y: e.clientY, tx: tx, ty: ty };
        pinchStartDist = null;
      } else if (ids.length === 2) {
        dragStart = null;
        var pts = ids.map(function (id) { return pointers[id]; });
        pinchStartDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      }
      if (!tracking) {
        tracking = true;
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp);
      }
    });

    // suppress the answer click if this gesture was actually a drag/pinch
    container.addEventListener('click', function (e) {
      if (moved > 10) e.stopPropagation();
    }, true);

    var zoomInBtn = document.getElementById('zoomInBtn');
    var zoomOutBtn = document.getElementById('zoomOutBtn');
    var zoomResetBtn = document.getElementById('zoomResetBtn');
    if (zoomInBtn) zoomInBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      animated(true);
      var r = container.getBoundingClientRect();
      zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.5);
    });
    if (zoomOutBtn) zoomOutBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      animated(true);
      var r = container.getBoundingClientRect();
      zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.5);
    });
    if (zoomResetBtn) zoomResetBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      animated(true);
      scale = 1; tx = 0; ty = 0; apply();
    });

    container._resetZoom = function () {
      animated(true);
      scale = 1; tx = 0; ty = 0; apply();
    };
  }
  setupPanZoom(mapWrap, svgMap);

  function formatCode(code) {
    return code + '-○○○' + (code.length <= 3 ? '○' : '');
  }

  function clearMarks() {
    var els = mapWrap.querySelectorAll('.prefecture.correct, .prefecture.wrong, .prefecture.reveal, .prefecture.skipped-reveal');
    for (var i = 0; i < els.length; i++) {
      els[i].classList.remove('correct', 'wrong', 'reveal', 'skipped-reveal');
    }
  }

  function setLocked(v) {
    locked = v;
    mapWrap.classList.toggle('locked-map', v);
  }

  function updateStats() {
    scoreNEl.textContent = score;
    answeredNEl.textContent = answered;
    progressNEl.textContent = idx + '/' + queue.length;
    progressFillEl.style.width = (idx / queue.length * 100) + '%';
  }

  function showStartOverlay() {
    startOverlay.classList.remove('hidden');
    updateProgressNote();
  }

  function newGame(count) {
    var remaining = keys.filter(function (k) { return !CORRECT[k]; });
    if (remaining.length === 0) {
      CORRECT = {};
      saveProgress();
      remaining = keys;
    }
    var shuffled = shuffle(remaining);
    queue = (count === 'all' || !count) ? shuffled : shuffled.slice(0, Math.min(count, shuffled.length));
    idx = 0;
    score = 0;
    answered = 0;
    clearMarks();
    setLocked(false);
    summaryCard.style.display = 'none';
    skipBtn.disabled = false;
    if (mapWrap._resetZoom) mapWrap._resetZoom();
    nextQuestion();
  }

  function nextQuestion() {
    if (idx >= queue.length) {
      showSummary();
      return;
    }
    currentKey = queue[idx];
    idx++;
    var d = PREF_DATA[currentKey];
    areaCodeEl.innerHTML = formatCode(d.code);
    hintCityEl.textContent = '(' + d.city + ' の市外局番)';
    feedbackEl.textContent = '地図から都道府県をクリックして解答してね';
    feedbackEl.className = 'feedback idle';
    updateStats();
    setLocked(false);
  }

  function showSummary() {
    updateStats();
    summaryCard.style.display = 'block';
    summaryScoreEl.textContent = score + '/' + queue.length;
    var pct = Math.round(score / queue.length * 100);
    var msg;
    if (pct === 100) msg = '完璧！全問正解です！';
    else if (pct >= 80) msg = 'お見事！かなり詳しいですね。';
    else if (pct >= 50) msg = 'まずまず！もう一周してみよう。';
    else msg = 'まだまだ伸びしろあり！復習してみよう。';
    summaryMsgEl.textContent = msg;
    areaCodeEl.textContent = '✓';
    hintCityEl.textContent = 'クイズ終了';
    skipBtn.disabled = true;
    setLocked(true);
  }

  function handleAnswer(selectedKey) {
    if (locked || !currentKey) return;
    setLocked(true);
    answered++;

    var selEl = mapWrap.querySelector('.prefecture[data-code="' + selectedKey + '"]');
    var correctEl = mapWrap.querySelector('.prefecture[data-code="' + currentKey + '"]');
    var d = PREF_DATA[currentKey];

    if (selectedKey === currentKey) {
      score++;
      CORRECT[currentKey] = true;
      saveProgress();
      if (selEl) selEl.classList.add('correct');
      feedbackEl.textContent = '✅ 正解！ ' + d.name + '（' + d.city + '）の市外局番は ' + d.code + ' です。';
      feedbackEl.className = 'feedback ok';
    } else {
      if (selEl) selEl.classList.add('wrong');
      if (correctEl) correctEl.classList.add('reveal');
      var wrongName = PREF_DATA[selectedKey] ? PREF_DATA[selectedKey].name : '不明';
      feedbackEl.textContent = '❌ 不正解… ' + d.code + ' は ' + d.name + '（' + d.city + '）でした。(選択: ' + wrongName + ')';
      feedbackEl.className = 'feedback bad';
    }
    updateStats();

    setTimeout(function () {
      clearMarks();
      nextQuestion();
    }, 1500);
  }

  function handleSkip() {
    if (locked || !currentKey) return;
    setLocked(true);
    var d = PREF_DATA[currentKey];
    var correctEl = mapWrap.querySelector('.prefecture[data-code="' + currentKey + '"]');
    if (correctEl) correctEl.classList.add('skipped-reveal');
    feedbackEl.textContent = '⏭️ スキップ： ' + d.code + ' は ' + d.name + '（' + d.city + '）でした。';
    feedbackEl.className = 'feedback skip';
    updateStats();
    setTimeout(function () {
      clearMarks();
      nextQuestion();
    }, 1200);
  }

  mapWrap.addEventListener('click', function (e) {
    var target = e.target.closest ? e.target.closest('.prefecture') : null;
    if (!target) return;
    var code = target.getAttribute('data-code');
    if (code) handleAnswer(code);
  });

  skipBtn.addEventListener('click', handleSkip);
  restartBtn.addEventListener('click', showStartOverlay);
  playAgainBtn.addEventListener('click', showStartOverlay);
  resetProgressBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    CORRECT = {};
    saveProgress();
    updateProgressNote();
  });

  var countButtons = startOverlay.querySelectorAll('button[data-count]');
  for (var ci = 0; ci < countButtons.length; ci++) {
    countButtons[ci].addEventListener('click', function () {
      var raw = this.getAttribute('data-count');
      var count = raw === 'all' ? 'all' : parseInt(raw, 10);
      startOverlay.classList.add('hidden');
      newGame(count);
    });
  }

  showStartOverlay();
})();
